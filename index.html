<!doctype html>
<html lang="en-us">
    <head>
        <!-- Meta -->
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Performacology</title>
        <meta name="description" content="Performacology">

        <!-- The compiled CSS file -->
        <link rel="stylesheet" href="/css/production.css">

        <!-- Web fonts -->
        <link href="https://fonts.googleapis.com/css?family=Montserrat:400,400i,700|Source+Serif+Pro:700" rel="stylesheet"> 

        <!-- favicon.ico. Place these in the root directory. -->
        <link rel="shortcut icon" href="/favicon.ico">

    </head>
    <body class="has-animations">
    <!-- Header -->
    <header class="align--center pt1">
        <div class="container--lg border--bottom pb1">
            <img class="logo mb2 reveal-on-scroll is-revealing" src="/img/logo.svg?v=1" alt="Performacology Logo">
            <h3 class="mb1">The study of Performance Engineering</h3>
            <!--h3>...and how it relates to the everything else.</h3-->
        </div>
    </header>
    <main>
        <!-- Latest Video on You Tube -->
        <div class="container pt1 mt0 text--dark-gray align--center">
            <!--h2 class="mb3">Latest Video</!--h2-->
            <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); background: #000;">
            <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
                src="https://www.youtube-nocookie.com/embed/videoseries?list=PLwp_NKWSfcIMhDSZqfaUjJvQDmE86ulFM" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
            </div>
        </div>

        <!-- Supported -->
        <div class="container--lg pt3 pb3 mb2 align--center">
            <p class="mb2">Peformacology is supported by:</p>
            <span>
                <a class="link link--text" href="https://performance-workshop.org/" target="_blank" rel="noopener">WOPR</a>,
                <a class="link link--text" href="https://abstracta.us/why-us/people" target="_blank" rel="noopener">Abstracta</a>, and
                <a class="link link--text" href="https://community.dynatrace.com/" target="_blank" rel="noopener">Dynatrace</a>
            </span>
        </div>

        <!-- CTA -->
        <div class="bg--dark-gray align--center pt2 pb2">
            <div class="container" style="max-width: 820px; display: flex; justify-content: center; align-items: center; gap: 16px;">
                <a href="https://www.linkedin.com/in/mtomlins/" class="link"><img class="download" src="/img/linkedin-logo-bottom.png?v=1" alt="Watch on the LinkedIn Page"></a>
                <a href="https://www.youtube.com/@performacology" class="link"><img class="download" src="/img/youtube-logo-bottom.png?v=1" alt="Watch on the YouTube"></a>
                <a href="https://community.dynatrace.com/t5/Community-user-groups/ct-p/Community_user_groups" class="link"><img class="download" src="/img/dynatrace-logo-bottom.png?v=1" alt="Visit the Dynatrace Community User Group"></a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="pt1 pb3 align--center-on-mobile">
        <div class="container">
            <div class="grid-row">
                <div class="grid-column mt2 span-half">
                    <p class="small">Design by <a href="https://www.papayatemplates.com" class="link link--text">Papaya</a>. Illustrations from&nbsp;<a href="https://undraw.co/" class="link link--text">Undraw</a>.</p>
                </div>
                <!-- social media icons 
                <div class="grid-column mt2 span-half align--right align--center-on-mobile">
                    <ul class="no-bullets list--inline">
                        <li class="mr1"><a href="" class="link"><img class="icon" src="img/bluesky-logo-bottom.png" alt="Bluesky"></a></li>
                        <li class="mr1"><a href="" class="link"><img class="icon" src="img/buymeacoffee-logo-bottom.png" alt="Buy Me A Coffee"></a></li>
                    </ul>
                </div>
                <-- social media icons -->
            </div>
        </div>
    </footer>

    <!-- Scroll reveal -->
    <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>

    <!-- The compiled JavaScript file -->
    <script src="/js/production.js"></script>

    </body>
</html>
